<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>ກວດເຊັກຄະແນນນັກຮຽນ - ScoreApp</title>
    <style>
        body { font-family: 'Phetsarath OT', sans-serif, Arial; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { text-align: center; color: #000000; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .btn-search { width: 100%; padding: 12px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-search:hover { background-color: #0b5ed7; }
        
        .student-info { background: #e7f3fe; border-left: 5px solid #0d6efd; padding: 12px 15px; border-radius: 6px; margin-bottom: 15px; display: none; line-height: 1.6; }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #95a5a6;
        }
        /* การ์ดสรุปคะแนนรวม/เฉลี่ย/อันดับ */
        .summary-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; text-align: center; }
        .summary-card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 12px; border-radius: 8px; }
        .summary-card .title { font-size: 13px; color: #6c757d; font-weight: bold; }
        .summary-card .value { font-size: 20px; font-weight: bold; color: #0d6efd; margin-top: 5px; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .btn-login-page { text-decoration: none; color: #6c757d; font-size: 14px; font-weight: bold; }
    </style>

</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="login.html" class="btn-login-page">🔐 ເຂົ້າສູ່ລະບົບ (ຄູ / Admin)</a>
    </div>

    <div class="card">
        <h2>🔍 ກວດເຊັກຄະແນນນັກຮຽນ</h2>
        
        <!-- เลือกห้องเรียน -->
        <!-- <div class="form-group">
            <label for="classSelect">🏫 ເລືອກຫ້ອງຮຽນ:</label>
            <select id="classSelect">
                <option value="">-- ກຳລັງໂຫຼດຫ້ອງຮຽນ... --</option>
            </select>
        </div> -->

        <!-- เลือกเดือน -->
        <div class="form-group">
            <label for="monthSelect">📅 ເລືອກເດືອນ:</label>
            <select id="monthSelect">
                <option value="">-- ເລືອກເດືອນ --</option>
                <option value="9">ເດືອນ 9 (ກັນຍາ)</option>
                <option value="10">ເດືອນ 10 (ຕຸລາ)</option>
                <option value="11">ເດືອນ 11 (ພະຈິກ)</option>
                <option value="12">ເດືອນ 12 (ທັນວາ)</option>
                <option value="1">ພາກຮຽນທີ I (ມັງກອນ)</option>
                <option value="2">ເດືອນ 2 (ກຸມພາ)</option>
                <option value="3">ເດືອນ 3 (ມີນາ)</option>
                <option value="4">ເດືອນ 4 (ເມສາ)</option>
                <option value="5">ພາກຮຽນທີ II (ພຶດສະພາ)</option>
                <option value="6">ເດືອນ 5 (ມິຖຸນາ)</option>
            </select>
        </div>

        <!-- ป้อนรหัสนักเรียน -->
        <div class="form-group">
            <label for="studentCodeInput">🆔 ປ້ອນລະຫັດນັກຮຽນ:</label>
            <input type="text" id="studentCodeInput" placeholder="ເຊັ່ນ: 6601">
        </div>

        <button class="btn-search" onclick="searchStudentScores()">🔎 ຄົ້ນຫາຄະແນນ</button>
    </div>

    <!-- ส่วนแสดงผลคะแนนและอันดับ -->
    <div class="card" id="resultCard" style="display: none;">
        <div class="student-info" id="studentInfo">
            <!-- ข้อมูลนักเรียน -->
        </div>

        <!-- กล่องสรุปคะแนนรวม / เฉลี่ย / อันดับ -->
        <div class="summary-box">
            <div class="summary-card">
                <div class="title">📊 ຄະແນນລວມ</div>
                <div class="value" id="totalScoreVal">-</div>
            </div>
            <div class="summary-card">
                <div class="title">📈 ຄະແນນສະເລ່ຍ</div>
                <div class="value" id="avgScoreVal">-</div>
            </div>
            <div class="summary-card">
                <div class="title">🏆 ຈັດອັນດັບທີ</div>
                <div class="value" style="color: #d63384;" id="rankVal">-</div>
            </div>
        </div>

        <h3>📋 ຕາຕະລາງຄະແນນທຸກວິຊາ</h3>
        <table>
            <thead>
                <tr>
                    <th>ວິຊາຮຽນ</th>
                    <th style="text-align: right;">ຄະແນນ</th>
                </tr>
            </thead>
            <tbody id="scoreTableBody">
                <!-- รายการคะแนนจะแสดงตรงนี้ -->
            </tbody>
        </table>
    </div>
</div>

<script src="script-index.js"></script>
 <div class="login-footer">
            <p>&copy; ລະບົບຈັດການຄະແນນນັກຮຽນ 2026</p>
        </div>
</body>
</html>
