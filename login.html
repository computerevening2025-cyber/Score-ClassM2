<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ເຂົ້າສູລະບົບສຳລັດຄູປະຈຳຊັ້ນ - ລະບົບຈັດການຄະແນນນັກຮຽນ</title>
    
    <!-- ดึงฟอนต์จาก Google Fonts เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .login-header h2 {
            margin: 0;
            color: #2c3e50;
            font-size: 24px;
        }
        .login-header p {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2980b9;
            box-shadow: 0 0 5px rgba(41, 128, 185, 0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2980b9;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #1f618d;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h2>ໜ້າເຂົ້າສູ່ລະບົບ</h2>
            <p>ສຳລັບຄູປະຈຳຊັ້ນ (ບັນທຶກຄະແນນ)</p>
        </div>
        
        <!-- ฟอร์มเข้าสู่ระบบ -->
        <form onsubmit="event.preventDefault(); loginSystem();">
            <div class="form-group">
                <label for="username">ຊື້ເຂົ້າໃຊ້ງານ</label>
                <input type="text" id="userInput" name="username" placeholder="ປ້ອນຊື່ເຂົ້າຜູ້ໃຊ້ງານ" required>
            </div>
            
            <div class="form-group">
                <label for="password">ລະຫັດຜ່ານ</label>
                <input type="password" id="passInput" name="password" placeholder="ປ້ອນລະຫັດຜ່ານ" required>
            </div>
            <button type="button" class="btn-submit" onclick="loginSystem()">ເຂົ້າສູ່ລະບົບ</button>
            <!-- <button type="submit" class="btn-submit">ເຂົ້າສູ່ລະບົບ</button> -->
        </form>

        <div class="login-footer">
            <p>&copy; ລະບົບຈັດການຄະແນນນັກຮຽນ 2026</p>
        </div>
    </div>
<script src="script-log.js"></script>
</body>
</html>
